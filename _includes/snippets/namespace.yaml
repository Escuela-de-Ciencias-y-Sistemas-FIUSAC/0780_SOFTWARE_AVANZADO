# Un namespace por equipo o estudiante con cuota, para que nadie tumbe a los demás en un clúster compartido.
apiVersion: v1
kind: Namespace
metadata:
  name: softav
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: softav-quota
  namespace: softav
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 6Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: softav-defaults
  namespace: softav
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 256Mi
