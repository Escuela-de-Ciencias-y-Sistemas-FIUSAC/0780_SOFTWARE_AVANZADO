# Tres patrones en un Pod: Init Container (espera la dependencia), contenedor principal
# y Sidecar (reenvía logs). Comparten un volumen emptyDir.
apiVersion: v1
kind: Pod
metadata:
  name: catalogo-patrones
  namespace: softav
  labels:
    app: catalogo-patrones
spec:
  volumes:
    - name: logs
      emptyDir: {}
  initContainers:
    - name: espera-db
      image: busybox:1.36
      command: ["sh", "-c", "until nc -z postgres 5432; do echo esperando a postgres; sleep 2; done"]
  containers:
    - name: app
      image: catalogo:1.0.0
      imagePullPolicy: IfNotPresent
      env:
        - name: LOGGING_FILE_NAME
          value: /var/log/app/catalogo.log
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
    - name: log-shipper
      image: busybox:1.36
      command: ["sh", "-c", "tail -n+1 -F /var/log/app/catalogo.log"]
      volumeMounts:
        - name: logs
          mountPath: /var/log/app
          readOnly: true
