apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo
  namespace: softav
  labels:
    app: catalogo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalogo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          # Imagen local cargada con: kind load docker-image catalogo:1.0.0 --name softav
          image: catalogo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalogo-config
            - secretRef:
                name: catalogo-db
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          # Spring tarda en arrancar: la startupProbe evita que la liveness mate el Pod antes de tiempo.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
