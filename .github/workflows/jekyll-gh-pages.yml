# Builds the Jekyll site with GitHub's preinstalled Pages environment
# and deploys it to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions"
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes to the default branch
  push:
    branches: ["main"]

  # Adds a "Run workflow" button in the Actions tab
  workflow_dispatch:

# Permissions for the automatic GITHUB_TOKEN
permissions:
  contents: read   # read the repo
  pages: write     # publish to Pages
  id-token: write  # prove identity to the Pages service

# Only one deployment at a time; never cancel one that's already running
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) Build the site into ./_site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # 2) Publish the built site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
