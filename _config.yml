# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.github_repo }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Software Avanzado
tagline: 0780 — Escuela de Ciencias y Sistemas, FIUSAC
description: Sitio del curso 0780 Software Avanzado, Facultad de Ingeniería, USAC
author: Escuela de Ciencias y Sistemas, FIUSAC
baseurl: '/0780_SOFTWARE_AVANZADO'
url: 'https://escuela-de-ciencias-y-sistemas-fiusac.github.io'
exclude: ["Gemfile", "Gemfile.lock", "LICENSE", "assets/slides/README.md"]

# Theme settings
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: dark
search_enabled: true
heading_anchors: true
permalink: pretty
aux_links:
  UEDi:
    - 'https://uedi.ingenieria.usac.edu.gt/web/'
  ECYS:
    - 'https://dtt-ecys.org/'
  Ing. Sebastian-Valle:
    - 'https://www.linkedin.com/in/sebastianvallebances'
  
footer_content:
github_repo: 'https://github.com/Escuela-de-Ciencias-y-Sistemas-FIUSAC/0780_SOFTWARE_AVANZADO'
# Raw URL of the snippets folder, so students can `kubectl apply -f` straight from the repo
snippets_raw_url: 'https://raw.githubusercontent.com/Escuela-de-Ciencias-y-Sistemas-FIUSAC/0780_SOFTWARE_AVANZADO/main/_includes/snippets'
# Files from _includes/snippets/ that the browser console (_includes/console.html) can ls / cat / kubectl apply -f
console_files:
  - Dockerfile
  - application.yaml
  - kind-config.yaml
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - patrones-sidecar.yaml
  - break-fix-01.yaml

# Just the Docs features used by the lecture pages
enable_copy_code_button: true
mermaid:
  version: "10.9.1"
callouts_level: quiet
callouts:
  note:
    title: Nota
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Cuidado
    color: yellow
  exam:
    title: En el examen CKAD
    color: purple
  pending:
    title: Pendiente
    color: grey-dk

# Sidebar section listing every lecture page
just_the_docs:
  collections:
    lectures:
      name: Clases
      nav_fold: true

# Collections for website data
collections:
  staffers:
  modules:
  schedules:
  announcements:
  lectures:
    output: true
    permalink: /clases/:name/
# Default layouts for each collection type
defaults:
  - scope:
      path: ''
      type: staffers
    values:
      layout: staffer
      height: 300
      subpath: '/assets/images/'
      width: 300
  - scope:
      path: ''
      type: modules
    values:
      layout: module
  - scope:
      path: ''
      type: schedules
    values:
      layout: schedule
  - scope:
      path: ''
      type: announcements
    values:
      layout: announcement
  - scope:
      path: ''
      type: lectures
    values:
      layout: lecture
      # Every lecture page ends with the browser console; set `console: false` in a lecture to hide it.
      console: true

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

liquid:
  error_mode: strict
  strict_filters: true
